# supervisor.conf — restart commands for managed tmux sessions
# Canonical source: /home/ayoub/hive-ui/supervisor.conf
#
# Format:
#   session:command
#   session:command|||http://health-check-url/
#
# Sessions in tmux but NOT listed here are health-checked but never restarted.
# Edit this file without restarting the supervisor — config reloads every sweep.

# PS5 kernel build pipeline monitor
build_monitor:while true; do bash /home/ayoub/hive-ui/monitor_builds.sh; echo "[$(date +%H:%M:%S)] monitor_builds exited — restarting in 5s"; sleep 5; done

# Hive UI dev server (port 8889) — HTTP health check ensures port is live after restart
# pkill prefix: kills any orphaned detached instance (nohup/PPID=1) before restart to avoid EADDRINUSE
hive-dev:pkill -f "PORT=8889 python3.*logstream.py" 2>/dev/null; sleep 1; PORT=8889 python3 /home/ayoub/hive-ui/logstream.py|||http://127.0.0.1:8889/

# Hive UI live server (port 8888) — nginx proxies http://192.168.1.18/ → here
hive-live:pkill -f "PORT=8888 python3.*logstream.py" 2>/dev/null; sleep 1; PORT=8888 python3 /home/ayoub/hive-ui/logstream.py|||http://127.0.0.1:8888/

# WeGIA research-loop journal follower — wrapped so journalctl exit on service restart doesn't kill session
hive-watch:while true; do journalctl --user -f -u research-loop.service; echo "[$(date +%H:%M:%S)] journalctl exited — restarting in 2s"; sleep 2; done

# OpenCode coding agent — restarts autonomously into a fresh session in hive-ui/
opencode:cd /home/ayoub/hive-ui && opencode

# Autonomous hive orchestrator — heartbeat, triage, LLM compaction every cycle
orchestrator:cd /home/ayoub/hive-ui && python3 orchestrator.py

# PS5 Slim exploit chain research hive
# synth-num-ctx 131072: reports are pre-trimmed to 300K chars (~100K tokens) before synthesis
# Model qwen3.6-abliterated-q3km supports up to 262144 ctx
ps5-hive:mkdir -p /tmp/ps5-research && python3 /home/ayoub/research_loop.py --mission 'PS5 Slim exploit chain research' --target-dir /tmp/ps5-research --report /home/ayoub/research/ps5-exploit.md --db /home/ayoub/research/ps5-queue.db --audit /home/ayoub/research/ps5-audit.jsonl --task-instructions /home/ayoub/hive-ui/ps5-task-instructions.txt --local-worker-model qwen3.6-abliterated-q3km --worker-count 1 --max-hours 0 --max-tasks 0 --batch-bytes 20000 --max-tokens 1024 --num-ctx 16384 --synth-num-ctx 131072 --log-level INFO 2>&1 | tee /home/ayoub/research/ps5-hive.log

# Next.js production UI (port 3001) — health check ensures port is live after restart
nextjs-prod:pkill -f "next-server" 2>/dev/null; sleep 1; cd /home/ayoub/hive-ui/web && npm run start 2>&1 | tee /tmp/nextjs.log|||http://127.0.0.1:3001/

# NOTE: watchdog is now integrated into supervisor.sh — no separate session needed
